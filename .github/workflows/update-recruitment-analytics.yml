name: Update Recruitment Analytics Report from Jira

on:
  schedule:
    #   03:40 UTC → morning refresh (early, before the 06:00 UTC Jenkins publish)
    #   17:00 UTC → evening refresh (20:00 Kyiv, after the workday)
    - cron: '40 3 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch: {}   # allow manual trigger from Actions tab

permissions:
  contents: write

# No concurrency group on purpose: with a group, queued runs get auto-cancelled
# ("All jobs were cancelled" emails). The conflict-safe push-retry below makes
# overlapping runs harmless, so we let them all finish instead of cancelling.

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run updater (REC + WRP → Recruitment Analytics Report)
        run: python3 scripts/update_recruitment_analytics.py

      - name: Commit & push if data changed (conflict-safe)
        run: |
          set -uo pipefail
          git config user.name  "rec-dashboard-bot[github-actions]"
          git config user.email "rec-dashboard-bot@users.noreply.github.com"
          REPORT=reports/Recruitment_Analytics_Report.html
          BRANCH="${GITHUB_REF_NAME:-main}"
          # No [skip ci]: this repo has no push-triggered workflows (only schedule +
          # workflow_dispatch), so nothing loops. Jenkins (which honours [skip ci])
          # must see these data-refresh commits to republish to pages.bttrm.tech.
          MSG="chore(analytics): auto-refresh Recruitment Analytics Report from Jira"
          if [[ -z "$(git status --porcelain "$REPORT")" ]]; then
            echo "ℹ No data changes — skipping commit."
            exit 0
          fi
          for attempt in 1 2 3; do
            git add "$REPORT"
            git commit -m "$MSG" || true
            if git push; then
              echo "✓ Pushed (attempt $attempt)."
              exit 0
            fi
            # Remote advanced (a concurrent refresh or a merged PR). Rather than a
            # rebase that can conflict on the data block, reset to the latest remote
            # and regenerate fresh data on top — the next push is a clean fast-forward.
            echo "Push rejected — syncing to origin/$BRANCH and regenerating (attempt $attempt)…"
            git fetch --quiet origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            python3 scripts/update_recruitment_analytics.py
            if [[ -z "$(git status --porcelain "$REPORT")" ]]; then
              echo "✓ Already up to date after regenerate — nothing to push."
              exit 0
            fi
          done
          echo "✗ Could not push after 3 attempts."
          exit 1
